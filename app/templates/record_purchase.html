{% extends "base.html" %}
{% block title %}Stock Tracker - Record Purchase{% endblock %}
{% block content %}
<div class="portfolio-header">
    <h2>Record Purchase – {{ symbol }}</h2>
    <p class="subtitle">Current holdings: {{ "%.4f"|format(current_shares) }} shares</p>
</div>

<div class="form-container" style="max-width:500px; margin:30px auto;">
    <form method="POST" action="{{ url_for('main.record_purchase', portfolio_id=portfolio_id, symbol=symbol) }}" class="stock-form">
        <fieldset>
            <legend>Purchase Details</legend>
            <div class="form-group">
                <label for="date">Purchase Date *</label>
                <input type="date" id="date" name="date" required class="form-input">
                <small>Price will be fetched automatically from market data</small>
            </div>
            <div class="form-group">
                <label for="shares">Shares to Buy *</label>
                <input type="number" id="shares" name="shares" step="0.0001" min="0" required placeholder="e.g. 10.5" class="form-input">
            </div>
            <div class="form-group" style="display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary">Record Purchase</button>
                <a href="{{ url_for('main.portfolio_view', portfolio_id=portfolio_id) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </fieldset>
    </form>
</div>

<style>
.stock-form { background:white; border:1px solid #ddd; border-radius:8px; padding:24px; box-shadow:0 2px 4px rgba(0,0,0,.1); }
.form-group { margin-bottom:18px; }
.form-group label { display:block; margin-bottom:6px; font-weight:600; color:#333; font-size:14px; }
.form-input { width:100%; padding:9px 11px; border:1px solid #ddd; border-radius:4px; font-size:14px; box-sizing:border-box; }
.form-group small { display:block; margin-top:5px; color:#888; font-size:12px; }
fieldset { border:none; padding:0; }
legend { font-size:16px; font-weight:600; margin-bottom:18px; color:#333; }
</style>
{% endblock %}
