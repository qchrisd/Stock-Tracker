{% extends "base.html" %}
{% block title %}Stock Tracker - Record Dividend{% endblock %}
{% block content %}
<div class="portfolio-header">
    <h2>Record Dividend – {{ symbol }}</h2>
    <p class="subtitle">Record dividend payments and optional reinvestments</p>
</div>

<div class="form-container" style="max-width:500px; margin:30px auto;">
    <form method="POST" action="{{ url_for('main.record_dividend', portfolio_id=portfolio_id, symbol=symbol) }}" class="stock-form">
        <fieldset>
            <legend>Dividend Details</legend>
            <div class="form-group">
                <label for="date">Dividend Date *</label>
                <input type="date" id="date" name="date" required class="form-input">
            </div>
            <div class="form-group">
                <label for="amount">Total Dividend Amount ($) *</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0" placeholder="e.g. 50.00" required class="form-input">
            </div>
            <div class="form-group" style="display:flex; align-items:center; gap:10px;">
                <input type="checkbox" id="reinvest" name="reinvest" style="width:auto;">
                <label for="reinvest" style="margin-bottom:0;">Reinvest dividend</label>
            </div>
            <div id="reinvestment-section" style="display:none; margin-top:16px; padding-top:16px; border-top:1px solid #eee;">
                <h4 style="margin-top:0;">Reinvestment Details</h4>
                <div class="form-group">
                    <label for="reinvest_price">Price per Share ($)</label>
                    <input type="number" id="reinvest_price" name="reinvest_price" step="0.01" min="0" class="form-input" placeholder="e.g. 150.00">
                    <small>Price per share at time of reinvestment</small>
                </div>
                <div id="reinvest-calc" style="color:#666; font-size:14px;"></div>
            </div>
            <div class="form-group" style="display:flex; gap:10px; margin-top:18px;">
                <button type="submit" class="btn btn-primary">Record Dividend</button>
                <a href="{{ url_for('main.portfolio_view', portfolio_id=portfolio_id) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </fieldset>
    </form>
</div>

<script>
const reinvestCheckbox = document.getElementById('reinvest');
const reinvestmentSection = document.getElementById('reinvestment-section');
const amountInput = document.getElementById('amount');
const priceInput = document.getElementById('reinvest_price');
const calcDisplay = document.getElementById('reinvest-calc');
reinvestCheckbox.addEventListener('change', function() {
    reinvestmentSection.style.display = this.checked ? 'block' : 'none';
    priceInput.required = this.checked;
    if (!this.checked) { priceInput.value = ''; calcDisplay.innerHTML = ''; }
});
function updateCalc() {
    const amt = parseFloat(amountInput.value) || 0;
    const price = parseFloat(priceInput.value) || 0;
    if (amt > 0 && price > 0) {
        calcDisplay.innerHTML = '<strong>Shares purchased:</strong> ' + (amt/price).toFixed(4);
    } else { calcDisplay.innerHTML = ''; }
}
amountInput.addEventListener('input', updateCalc);
priceInput.addEventListener('input', updateCalc);
</script>

<style>
.stock-form { background:white; border:1px solid #ddd; border-radius:8px; padding:24px; box-shadow:0 2px 4px rgba(0,0,0,.1); }
.form-group { margin-bottom:18px; }
.form-group label { display:block; margin-bottom:6px; font-weight:600; color:#333; font-size:14px; }
.form-input { width:100%; padding:9px 11px; border:1px solid #ddd; border-radius:4px; font-size:14px; box-sizing:border-box; }
.form-group small { display:block; margin-top:5px; color:#888; font-size:12px; }
fieldset { border:none; padding:0; }
legend { font-size:16px; font-weight:600; margin-bottom:18px; color:#333; }
</style>
{% endblock %}
